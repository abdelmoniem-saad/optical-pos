# Render Blueprint — the new React + Supabase web app (LensyPOS).
#
# The OLD Render service ran the Flet/Python app (type: web, env: python). That
# is why opening the old URL still shows Flet. The React app is a different kind
# of service — a STATIC SITE — so it can't reuse the same service; this defines a
# new one named "lensy-web".
#
# To switch over:
#   1. Render Dashboard → New → Blueprint → select this repo (deploys lensy-web).
#   2. In the new static site, set env vars VITE_SUPABASE_URL and
#      VITE_SUPABASE_ANON_KEY (same values as your Supabase project).
#   3. Verify the new site works, then move your custom domain from the old
#      Flet service to lensy-web and suspend/delete the old "lensy-pos" service.

services:
  - type: web
    name: lensy-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false # set in dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # set in dashboard
      - key: VITE_AUTH_EMAIL_DOMAIN
        value: lensypos.local
    routes:
      # SPA fallback so client-side routes (/pos, /history, …) resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
