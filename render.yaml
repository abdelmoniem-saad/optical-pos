# Render Blueprint — LensyPOS web app (React + Supabase), a STATIC site.
#
# The old Flet/Python service has been RETIRED from this repo (its code, Procfile
# and requirements are gone), so this static site with rootDir: web is the only
# deployment that exists here.
#
# Setup: Render Dashboard → New → Blueprint → select this repo (deploys
# "lensy-web"), then set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the
# service's environment. If the legacy "lensy-pos" Python service still shows in
# the dashboard, suspend/delete it there - it can no longer build from main.

services:
  - type: web
    name: lensy-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false # set in dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # set in dashboard
      - key: VITE_AUTH_EMAIL_DOMAIN
        value: lensypos.local
    routes:
      # SPA fallback so client-side routes (/pos, /history, …) resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
