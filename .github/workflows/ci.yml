name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build (vite)
        run: npm run build

  db:
    name: pgTAP · migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Throwaway Postgres 16 with pgTAP
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lensy -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec pg bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap'

      - name: Install the psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply 000…012 and run the pgTAP gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lensy
        run: |
          set -o pipefail
          status=0
          bash web/scripts/test-db.sh 2>&1 | tee db-gate.log || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### db gate failed (exit $status)"
              echo ""
              echo '```'
              tail -80 db-gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::db gate failed (exit $status): $(tail -5 db-gate.log | tr '\n' ' ' | cut -c1-800)"
            exit "$status"
          fi
