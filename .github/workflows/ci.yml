name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build (vite)
        run: npm run build

  db:
    name: pgTAP · migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Throwaway Postgres 16 with pgTAP
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lensy -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec pg bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap'

      - name: Install the psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply every migration in order and run the pgTAP gates
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lensy
        run: |
          set -o pipefail
          status=0
          bash web/scripts/test-db.sh 2>&1 | tee db-gate.log || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### db gate failed (exit $status)"
              echo ""
              echo '```'
              cat db-gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Annotations are the only log channel visible without signing in
            # to GitHub: emit one per failed assertion, pgTAP diagnostics
            # folded onto the same line, plus any ERROR anywhere in the line
            # (psql indents some of them) and a tail of the log.
            #
            # "not ok" must be anchored to the START of the line with a word
            # boundary, or a description that happens to contain the phrase
            # ("...counts what the UI excludes, not ok") is reported as a
            # failure. psql also indents some TAP output, so leading whitespace
            # is allowed but only before the first non-space character.
            awk '
              /^[[:space:]]*not ok/ { if (buf) print buf; buf=$0; n=6; next }
              /^#/ && n > 0 { buf = buf " | " $0; n-- }
              /^CAPERR/ { if (buf) print buf; buf=""; print; next }
              /ERROR|FATAL|^FAIL:/ { if (buf) print buf; buf=""; print; next }
              END { if (buf) print buf }
            ' db-gate.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:1800}"
            done
            # A psql ERROR aborts the whole gate file, and when that happens the
            # TAP stream never appears at all. The awk above only keys off
            # "not ok", so on a syntax error it would emit nothing and the real
            # cause would be buried under the generic tail below.
            grep -nE 'ERROR|FATAL' db-gate.log | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:1800}"
            done
            echo "::error file=web/db-gate.log::last 30 lines of the db gate:"
            tail -30 db-gate.log | while IFS= read -r line; do
              echo "::error::${line:0:1800}"
            done
            echo "::error::db gate failed (exit $status)"
            exit "$status"
          fi

      - name: Install pg_dump (postgresql-client)
        # pg_dump ships in postgresql-client-NN, not in the bare
        # postgresql-client meta-package on every runner image.
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          pg_dump --version

      - name: Schema drift · fingerprint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lensy
        run: |
          set -o pipefail
          baseline_file=web/supabase/schema.fingerprint

          # Take the fingerprint TWICE and require the two to agree before
          # comparing either to the baseline. A hash of a moving target is
          # not a drift check, it is noise - and the failure mode is expensive
          # because it invites someone to delete the file. Run #71 failed
          # against a schema nobody had touched: pg_dump emits a fresh random
          # \restrict token per invocation, so the raw digest changes every
          # time. Proving stability here means a future non-determinism is
          # reported as "the check itself is broken" rather than as fake drift.
          first="$(bash web/scripts/schema-fingerprint.sh)"
          second="$(bash web/scripts/schema-fingerprint.sh)"
          actual="$first"

          if [ "$first" != "$second" ]; then
            echo "::error::schema-fingerprint.sh is NOT deterministic ($first vs $second) - the drift check cannot be trusted until that is fixed. Do NOT update the baseline in response to this."
            echo "::error::The usual cause is content that varies per pg_dump run (a random \\restrict token)."
            exit 1
          fi

          {
            echo "### schema fingerprint"
            echo ""
            echo '```'
            echo "actual:   $actual (stable across 2 runs)"
            if [ -f "$baseline_file" ]; then
              echo "recorded: $(tr -d '[:space:]' < "$baseline_file")"
            else
              echo "recorded: (none yet - this run records it)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$actual" > schema.fingerprint.actual

          if [ ! -f "$baseline_file" ]; then
            # BOOTSTRAP. The baseline is a hash of a database that only exists
            # in CI, so the first run cannot have one. Record it as an artifact
            # and let the human commit it - a drift signal that has never been
            # recorded is not a drift signal, and silently passing would be the
            # worst version of that.
            echo "::notice::No schema.fingerprint recorded yet. Download the artifact, commit it, and this step becomes enforcing."
            exit 0
          fi

          # Both sides are compared with whitespace stripped. `cat` keeps the
          # trailing newline, and a checkout on a machine with CRLF could add a
          # CR - either would make a byte-comparison fail against a schema that
          # has not changed, which is the worst possible failure for a drift
          # check: it cries wolf until someone disables it. Also rejects a
          # baseline that is not 64 hex characters, which means the file was
          # saved wrong (a truncated download, a zip, an HTML error page) - that
          # must be a clear error, not a permanent red build.
          recorded="$(tr -d '[:space:]' < "$baseline_file")"
          if ! printf '%s' "$recorded" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error file=web/supabase/schema.fingerprint::The baseline is not a 64-character hex hash (got '$recorded'). Re-download the schema-fingerprint artifact and save ONLY the hash line, renamed to schema.fingerprint."
            exit 1
          fi

          if [ "$actual" != "$recorded" ]; then
            echo "::error file=web/supabase/schema.fingerprint::The database shape changed. recorded=$recorded actual=$actual"
            echo "::error::A migration altered the schema (or one was added/edited). Review the diff, then update web/supabase/schema.fingerprint with: $actual"
            exit 1
          fi
          echo "Schema fingerprint matches ($actual)"

      - name: Upload fingerprint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-fingerprint
          path: |
            schema.fingerprint.actual
            web/supabase/schema.fingerprint
          if-no-files-found: ignore
